name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Placeholder values only. The build checks that the app compiles and
      # never contacts Supabase. Real keys stay in Vercel.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://placeholder.vercel.app

  design:
    name: Design gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Checks the mechanical rules of docs/ux-ui-guidelines.md. The script
      # has no dependencies, so there is no install step.
      - name: Design gate
        run: npm run design

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones are disabled for better analysis

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrations-check:
    name: Validate migrations
    runs-on: ubuntu-latest
    env:
      # The CLI looks for an access token on startup even for commands that
      # never touch a real project (supabase/cli#1872). It is not used to link
      # or push here: --local keeps this job on a throwaway Postgres in Docker.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # Pinned, not latest, so the runner does not hit the GitHub API rate
      # limit looking it up. Bump it by hand.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # Applies every file in supabase/migrations to a throwaway local
      # database, in order. Never touches the real Supabase project.
      - name: Start local Supabase stack
        run: supabase start

      - name: Lint schema for errors
        run: supabase db lint --local
